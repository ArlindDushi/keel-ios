<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Keel app icon. The keel is the timber running the whole length of the hull's bottom,
    rising into the stem like on ancient wooden ships.
    Hull + keel = the foundation Keel generates. Dashed mast and sails = the app you build on top.
    The PNGs in App/Assets.xcassets/AppIcon.appiconset are exported from this file.
    Follows the macOS icon grid: an 824 × 824 rounded square centred on a 1024 canvas.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7BF0"/>
      <stop offset="0.62" stop-color="#1450B8"/>
      <stop offset="1" stop-color="#0B2F78"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2A6B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#061A4A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E6FA"/>
    </linearGradient>
    <linearGradient id="keel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C27E"/>
      <stop offset="1" stop-color="#E8955E"/>
    </linearGradient>
    <linearGradient id="keelWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8955E"/>
      <stop offset="0.5" stop-color="#F4B27A"/>
      <stop offset="1" stop-color="#E8955E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" x="104" y="104">
      <path d="M48 0 H0 V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
    </pattern>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020B24" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- Blueprint grid -->
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>

    <!-- Sea: the keel lives below the waterline -->
    <path d="M100 640 C 190 622, 260 658, 350 640 S 520 622, 610 640 S 780 658, 924 636 V 924 H 100 Z" fill="url(#sea)"/>
    <path d="M100 640 C 190 622, 260 658, 350 640 S 520 622, 610 640 S 780 658, 924 636" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5"/>

    <!-- What you build: mast and sails as a dashed blueprint -->
    <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26 18" opacity="0.92">
      <!-- The mast doubles as the front edge of both sails -->
      <path d="M526 218 V 532"/>
      <path d="M508 252 L 336 516 H 508"/>
      <path d="M544 252 L 744 516 H 544"/>
    </g>

    <!-- What Keel builds: hull and keel -->
    <g filter="url(#soft)">
      <path d="M262 540 H 790 Q 772 602, 712 640 Q 690 652, 660 652 H 360 Q 330 652, 310 640 Q 280 612, 262 540 Z" fill="url(#hull)"/>
    </g>
    <!-- Keel: one timber along the whole bottom, thickest at the middle, rising into the stem at the bow -->
    <g filter="url(#soft)">
      <path d="M262 540 Q 280 612, 310 640 Q 330 652, 360 652 H 660 Q 690 652, 712 640 Q 772 602, 790 540
               L 798 536 Q 784 616, 724 656 Q 696 676, 660 676 H 360 Q 324 676, 298 656 Q 264 616, 254 536 Z"
            fill="url(#keelWood)"/>
      <path d="M794 540 Q 804 516, 820 500" fill="none" stroke="url(#keelWood)" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Gloss -->
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  </g>
</svg>
