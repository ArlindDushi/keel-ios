included:
  - {{APP_NAME}}
{{#if tests}}
  - {{APP_NAME}}Tests
  - {{APP_NAME}}UITests
{{/if}}

excluded:
  - DerivedData
  - .build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - id
    - x
    - y
    - to

# Clean Swift nests Request / Response / ViewModel types inside each scene's models.
nesting:
  type_level: 3

type_body_length:
  warning: 300

file_length:
  warning: 500
